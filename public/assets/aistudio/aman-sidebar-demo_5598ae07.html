<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aman Computer — Sidebar Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c1208;--tx:#f3ead9;--mut:rgba(243,234,217,.56);--mut2:rgba(243,234,217,.36);
  --line:rgba(255,232,200,.14);--gl:rgba(255,236,205,.07);--gold:#e3ab63;--grn:#55d6a0;
  --blur:24px;--pg:#0c0806;--p3:cubic-bezier(.215,.61,.355,1);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  color:var(--tx);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  background:
   radial-gradient(60% 38% at 14% 0,rgba(227,171,99,.28),transparent 70%),
   radial-gradient(55% 34% at 90% 4%,rgba(85,214,160,.12),transparent 70%),
   radial-gradient(70% 30% at 50% 100%,rgba(120,70,24,.22),transparent 70%),var(--pg);
  background-attachment:fixed;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.gl{background:linear-gradient(180deg,rgba(255,236,205,.09),rgba(255,236,205,.035));border:1px solid var(--line);backdrop-filter:blur(var(--blur)) saturate(1.25);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 16px 44px rgba(0,0,0,.32)}

/* ---------- Demo page content ---------- */
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px}
main .brand-mark{width:56px;height:56px;border:1.5px solid rgba(227,171,99,.5);border-radius:16px;display:grid;place-items:center;font-size:22px;font-weight:700;color:var(--gold);margin-bottom:18px}
main h1{font-size:clamp(26px,5vw,40px);font-weight:800;letter-spacing:-.01em}
main p{color:var(--mut);margin-top:10px;font-size:14.5px;max-width:420px}
main .hint{margin-top:26px;font-size:12px;color:var(--mut2);display:flex;align-items:center;gap:8px}
main .hint svg{width:14px;height:14px}

/* ---------- Backdrop ---------- */
#backdrop{position:fixed;inset:0;z-index:48;background:rgba(8,5,3,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .4s var(--p3)}
#backdrop.show{opacity:1;pointer-events:auto}

/* ---------- Sidebar rail / panel ---------- */
aside{
  position:fixed;left:16px;top:50%;transform:translateY(-50%);z-index:50;width:56px;
  display:flex;flex-direction:column;gap:5px;padding:9px;border-radius:26px;
  transition:width .42s var(--p3),top .42s var(--p3),bottom .42s var(--p3),transform .42s var(--p3),
             border-radius .42s var(--p3),padding .42s var(--p3);
  max-height:calc(100vh - 32px);
}
aside.open{width:252px;top:env(safe-area-inset-top,14px);bottom:env(safe-area-inset-bottom,14px);transform:none;border-radius:24px;padding:14px 12px;align-items:stretch;overflow-y:auto;max-height:none}

aside button,aside>.dock-wa,aside>.dock-clock{position:relative;flex:none;transition:background .2s,color .2s,transform .2s}
.rail-btn{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:var(--mut)}
.rail-btn:hover{background:rgba(255,255,255,.1);color:var(--tx)}
.rail-btn:active{transform:scale(.92)}
.tip{position:absolute;left:50px;top:50%;transform:translateY(-50%) translateX(-4px);background:#0a0603;color:var(--tx);
  font-size:10.5px;font-weight:500;padding:5px 10px;border-radius:9px;opacity:0;pointer-events:none;transition:.18s;white-space:nowrap;z-index:5}
aside:not(.open) button:hover .tip,aside:not(.open) .dock-wa:hover .tip,aside:not(.open) .dock-clock:hover .tip{opacity:1;transform:translateY(-50%) translateX(0)}

/* nav rail buttons (collapsed) */
.nav-btn{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:var(--mut);width:100%}
.nav-btn:hover{background:rgba(255,255,255,.1);color:var(--tx)}
.nav-btn.active{background:var(--gold);color:#1c1208}
.nav-btn.active:hover{background:var(--gold);color:#1c1208}
.lbl{display:none;font-size:13px;font-weight:500;white-space:nowrap}

/* head / section label (expanded only) */
.dock-head{display:none;align-items:center;justify-content:space-between;padding:2px 4px 12px;flex:none}
.dock-head .db{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700}
.dock-head .db i{width:7px;height:7px;border-radius:50%;background:var(--gold);display:inline-block;box-shadow:0 0 0 3px rgba(227,171,99,.2)}
.dock-x{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--mut)}
.dock-x:hover{background:rgba(255,255,255,.1);color:var(--tx)}
.dock-sec{display:none;font-size:10px;letter-spacing:.1em;color:var(--mut2);font-weight:700;padding:4px 8px 7px;flex:none}
aside:not(.open) .dock-head,aside:not(.open) .dock-sec{display:none}
aside.open .dock-head{display:flex}
aside.open .dock-sec{display:block}
aside.open #dockOpen{display:none}

/* expanded nav rows */
#dockNav{display:flex;flex-direction:column;gap:3px}
aside.open .nav-btn{height:40px;border-radius:12px;display:flex;align-items:center;justify-content:flex-start;gap:12px;padding:0 10px}
aside.open .lbl{display:inline}

/* WhatsApp block */
.dock-wa{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:var(--grn);margin-top:4px}
.dock-wa:hover{background:rgba(85,214,160,.14)}
.dock-wa .wa-txt{display:none}
.dock-wa .wa-arrow{display:none}
aside.open{}
aside.open .dock-wa{
  width:100%;height:auto;border-radius:14px;display:flex;align-items:center;gap:11px;padding:11px 12px;margin-top:8px;
  background:rgba(85,214,160,.1);border:1px solid rgba(85,214,160,.28);
}
aside.open .dock-wa .wa-ic{width:19px;height:19px;flex:none}
aside.open .dock-wa .wa-txt{display:flex;flex-direction:column;gap:1px;flex:1;text-align:left}
aside.open .dock-wa .wa-txt b{font-size:10px;letter-spacing:.08em;color:var(--grn);font-weight:700}
aside.open .dock-wa .wa-txt small{font-size:13px;color:var(--tx);font-weight:600}
aside.open .dock-wa .wa-arrow{display:block;width:15px;height:15px;color:var(--grn);flex:none}
aside.open .dock-wa:hover{background:rgba(85,214,160,.16)}

/* Clock block */
.dock-clock{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:var(--mut)}
.dock-clock .clock-txt{display:none}
aside.open .dock-clock{
  width:100%;height:auto;display:flex;align-items:center;gap:9px;padding:9px 10px 4px;color:var(--mut2);
  margin-top:2px;
}
aside.open .dock-clock svg{width:14px;height:14px;flex:none}
aside.open .dock-clock .clock-txt{display:inline;font-size:11.5px;font-weight:500}

/* ---------- Desktop ≥760px ---------- */
@media (min-width:760px){
  aside.open{width:252px}
}
/* ---------- Mobile <760px : collapsed rail hides everything but the trigger ---------- */
@media (max-width:759px){
  aside:not(.open)>*:not(#dockOpen){display:none}
  aside:not(.open){padding:7px;width:50px;left:14px;top:14px;bottom:auto;transform:none;border-radius:16px}
  aside.open{
    left:0;top:0;bottom:0;width:min(88vw,320px);border-radius:0 22px 22px 0;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 14px) 14px;
  }
}
@media (prefers-reduced-motion:reduce){
  aside,aside *{transition:none!important}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
<defs>
<symbol id="ic-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
<symbol id="ic-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="ic-home" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/></symbol>
<symbol id="ic-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></symbol>
<symbol id="ic-file" viewBox="0 0 24 24"><path d="M7 3.5h7l4 4V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1z"/><path d="M8.5 12h7M8.5 15.5h7M8.5 8.5h3"/></symbol>
<symbol id="ic-layers" viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="M3 12l9 5 9-5M3 16l9 5 9-5"/></symbol>
<symbol id="ic-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m4 18 5-5 3.5 3.5L17 11l3 3"/></symbol>
<symbol id="ic-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m14.6 9.4-1.3 3.9-3.9 1.3 1.3-3.9z"/></symbol>
<symbol id="ic-bank" viewBox="0 0 24 24"><path d="M4 21h16M5 21V10M9 21V10M15 21V10M19 21V10M3 10l9-5 9 5"/></symbol>
<symbol id="ic-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.4 7-11.5A7 7 0 0 0 5 9.5C5 14.6 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></symbol>
<symbol id="ic-wa" viewBox="0 0 24 24" stroke-width="0" fill="currentColor"><path d="M12 2.2a9.8 9.8 0 0 0-8.4 14.8L2.2 21.8l4.9-1.3A9.8 9.8 0 1 0 12 2.2zm0 1.7a8.1 8.1 0 1 1 0 16.2 8 8 0 0 1-4.1-1.1l-.3-.2-2.9.8.8-2.8-.2-.3A8.1 8.1 0 0 1 12 3.9z"/><path d="M9.1 7.6c-.2-.5-.4-.5-.7-.5h-.5c-.2 0-.6.1-.9.4-.3.3-1.1 1.1-1.1 2.6s1.2 3 1.3 3.2c.2.2 2.4 3.6 5.8 5 .8.3 1.5.5 2 .7.8.2 1.5.2 2.1.1.6-.1 2-.8 2.3-1.6.3-.8.3-1.5.2-1.6-.1-.2-.3-.2-.6-.4s-2-1-2.3-1.1c-.3-.1-.5-.2-.8.2-.2.3-.9 1.1-1.1 1.3-.2.2-.4.3-.7.1s-1.4-.5-2.6-1.6c-1-.9-1.6-2-1.8-2.3-.2-.3 0-.5.1-.7l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5-.1-.2-.6-1.6-.9-2.2z"/></symbol>
<symbol id="ic-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
<symbol id="ic-arrow" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></symbol>
</defs>
</svg>

<main>
  <div class="brand-mark">A</div>
  <h1>Aman Computer</h1>
  <p>This page is a standalone demo of the floating glass sidebar. Open it with the icon on the left to explore all 8 sections, chat on WhatsApp, or check the local time.</p>
  <div class="hint"><svg class="i"><use href="#ic-arrow"/></svg>Tap the rail on the left to expand</div>
</main>

<div id="backdrop"></div>

<aside class="gl" id="dock">
  <button class="rail-btn" id="dockOpen"><svg class="i"><use href="#ic-menu"/></svg><span class="tip">Menu</span></button>

  <div class="dock-head">
    <span class="db"><i></i>Aman Computer</span>
    <button class="dock-x" id="dockClose"><svg class="i"><use href="#ic-x"/></svg></button>
  </div>
  <div class="dock-sec">Navigate</div>

  <nav id="dockNav">
    <button class="nav-btn active" data-label="Home"><svg class="i"><use href="#ic-home"/></svg><span class="lbl">Home</span><span class="tip">Home</span></button>
    <button class="nav-btn" data-label="Latest Updates"><svg class="i"><use href="#ic-bell"/></svg><span class="lbl">Latest Updates</span><span class="tip">Latest Updates</span></button>
    <button class="nav-btn" data-label="Documents Need"><svg class="i"><use href="#ic-file"/></svg><span class="lbl">Documents Need</span><span class="tip">Documents Need</span></button>
    <button class="nav-btn" data-label="Our Services"><svg class="i"><use href="#ic-layers"/></svg><span class="lbl">Our Services</span><span class="tip">Our Services</span></button>
    <button class="nav-btn" data-label="Gallery"><svg class="i"><use href="#ic-image"/></svg><span class="lbl">Gallery</span><span class="tip">Gallery</span></button>
    <button class="nav-btn" data-label="Our Journey"><svg class="i"><use href="#ic-compass"/></svg><span class="lbl">Our Journey</span><span class="tip">Our Journey</span></button>
    <button class="nav-btn" data-label="Government Schemes"><svg class="i"><use href="#ic-bank"/></svg><span class="lbl">Government Schemes</span><span class="tip">Government Schemes</span></button>
    <button class="nav-btn" data-label="Contact &amp; Location"><svg class="i"><use href="#ic-pin"/></svg><span class="lbl">Contact &amp; Location</span><span class="tip">Contact &amp; Location</span></button>
  </nav>

  <button class="dock-wa" id="dockWa">
    <svg class="i wa-ic"><use href="#ic-wa"/></svg>
    <span class="tip">WhatsApp us · +91 85955 15718</span>
    <span class="wa-txt"><b>WHATSAPP US</b><small>+91 85955 15718</small></span>
    <svg class="i wa-arrow"><use href="#ic-arrow"/></svg>
  </button>

  <div class="dock-clock" id="dockClock">
    <svg class="i"><use href="#ic-clock"/></svg>
    <span class="tip" id="clockTip">Local time · --:--</span>
    <span class="clock-txt" id="clockTxt">Local time · --:--</span>
  </div>
</aside>

<div id="toast" style="position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);z-index:60;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;" class="gl"></div>

<script>
const $=s=>document.querySelector(s);
const dock=$('#dock'),backdrop=$('#backdrop');

function setDock(open){
  dock.classList.toggle('open',open);
  backdrop.classList.toggle('show',open);
  document.body.style.overflow=open?'hidden':'';
}
$('#dockOpen').addEventListener('click',()=>setDock(true));
$('#dockClose').addEventListener('click',()=>setDock(false));
backdrop.addEventListener('click',()=>setDock(false));
addEventListener('keydown',e=>{if(e.key==='Escape')setDock(false)});

/* nav buttons: active state + demo toast */
let toastTimer;
function showToast(text){
  const t=$('#toast');
  t.textContent=text;
  t.style.opacity='1';t.style.transform='translate(-50%,0)';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{t.style.opacity='0';t.style.transform='translate(-50%,16px)'},1800);
}
document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    showToast('Opened: '+btn.dataset.label);
    if(window.innerWidth<760){setTimeout(()=>setDock(false),260)}
  });
});

/* WhatsApp */
$('#dockWa').addEventListener('click',()=>window.open('https://wa.me/918595515718','_blank'));

/* Live clock — Asia/Kolkata */
function fmtTime(){
  const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Kolkata',hour:'numeric',minute:'2-digit',hour12:true}).formatToParts(new Date());
  let h='',m='',ap='';
  parts.forEach(p=>{if(p.type==='hour')h=p.value;if(p.type==='minute')m=p.value;if(p.type==='dayPeriod')ap=p.value.toLowerCase()});
  return `Local time · ${h}:${m}${ap}`;
}
function tickClock(){
  const txt=fmtTime();
  $('#clockTxt').textContent=txt;
  $('#clockTip').textContent=txt;
}
tickClock();
setInterval(tickClock,30000);
</script>
</body>
</html>
