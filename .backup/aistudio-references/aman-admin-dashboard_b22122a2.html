<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#f1e8da;--ink:#20150b;--tx:#f1e7d6;--mut:rgba(241,231,214,.55);--mut2:rgba(241,231,214,.36);--line:rgba(255,232,200,.13);--gl:rgba(255,236,205,.065);--gold:#e9b46b;--grn:#93d6a3;--red:#e8918a;--blur:26px;--pg:#0e0805;--p3:cubic-bezier(.215,.61,.355,1);--pio:cubic-bezier(.645,.045,.355,1)}
body.light{--tx:#2a1b0e;--mut:rgba(42,27,14,.6);--mut2:rgba(42,27,14,.4);--line:rgba(60,35,10,.15);--gl:rgba(255,255,255,.4);--pg:#e8d9c2;--cream:#2a1b0e;--ink:#f6ecdc}
*{box-sizing:border-box;margin:0}
body{font-family:Urbanist,system-ui,sans-serif;color:var(--tx);min-height:100vh;background:
radial-gradient(60% 38% at 12% 0,rgba(196,112,38,.55),transparent 70%),radial-gradient(50% 34% at 88% 2%,rgba(160,84,26,.45),transparent 70%),radial-gradient(70% 30% at 50% 100%,rgba(120,66,24,.35),transparent 70%),
repeating-linear-gradient(90deg,rgba(255,200,130,.02) 0 38px,rgba(0,0,0,.02) 38px 76px),var(--pg);background-attachment:fixed}
body.light{background:radial-gradient(60% 40% at 15% 0,#f3c78f,transparent 70%),radial-gradient(50% 40% at 90% 10%,#e9b27a,transparent 70%),var(--pg)}
button,input{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.gl{background:linear-gradient(180deg,rgba(255,236,205,.085),rgba(255,236,205,.04));border:1px solid var(--line);backdrop-filter:blur(var(--blur)) saturate(1.2);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 14px 40px rgba(0,0,0,.28)}
svg.i{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{position:sticky;top:12px;z-index:40;margin:12px 16px 0 84px;height:56px;border-radius:20px;display:flex;align-items:center;gap:14px;padding:0 12px;background:rgba(45,25,14,.55)}
.brand{display:flex;align-items:center;gap:10px}.logo{width:36px;height:36px;border-radius:11px;background:var(--cream);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:15px}
.brand b{font-size:14px;display:block;font-weight:600;line-height:1.1}.brand small{font-size:9.5px;color:var(--mut)}
nav{position:relative;display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(0,0,0,.2);border:1px solid var(--line);margin:0 auto 0 14px}
.pill{position:absolute;top:4px;bottom:4px;left:0;right:0;border-radius:999px;background:var(--cream);box-shadow:0 4px 14px rgba(0,0,0,.3)}
nav button{position:relative;z-index:1;display:flex;align-items:center;gap:7px;padding:7px 13px;font-size:12px;border-radius:999px;color:var(--mut);transition:color .35s;white-space:nowrap}
nav button.on{color:var(--ink);font-weight:600}nav button:not(.on):hover{color:var(--tx)}
.bd{background:var(--gold);color:#20150b;font-size:9.5px;font-weight:700;border-radius:99px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
.rt{display:flex;align-items:center;gap:18px;font-size:12px;font-weight:600;position:relative}
.rt button{display:flex;align-items:center;gap:7px;position:relative}
.av{width:32px;height:32px;border-radius:50%;background:var(--gold);color:#20150b;display:grid;place-items:center;font-size:10px;font-weight:700;position:relative}
.nd{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--gold);top:-1px;right:-2px}
#pop{position:absolute;top:44px;right:0;width:230px;border-radius:16px;padding:14px;background:rgba(40,24,14,.85);display:none;font-weight:500}
#pop.show{display:block;animation:cin .3s both}#pop label{display:block;font-size:11px;color:var(--mut);margin:8px 0 4px}#pop input{width:100%;accent-color:var(--gold)}
aside{position:fixed;left:16px;top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;gap:5px;padding:8px;border-radius:26px;background:rgba(45,25,14,.55);width:54px;transition:width .38s var(--p3),top .38s var(--p3),bottom .38s var(--p3),transform .38s var(--p3),border-radius .38s var(--p3),padding .38s var(--p3)}
aside .sp{height:1px;background:var(--line);margin:7px 4px;flex:none}
aside button{position:relative;width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:var(--mut);transition:background .2s,color .2s,transform .2s,width .3s,justify-content .3s;flex:none}
aside button:hover{background:rgba(255,255,255,.1);color:var(--tx)}aside button:active{transform:scale(.92)}
aside .pr{background:var(--cream);color:var(--ink)}aside .pr:hover{background:var(--cream);color:var(--ink)}
.tip{position:absolute;left:50px;background:#0b0603;color:var(--tx);font-size:10.5px;font-weight:500;padding:5px 10px;border-radius:9px;opacity:0;transform:translateX(-4px);pointer-events:none;transition:.18s;white-space:nowrap;z-index:5}
aside button:hover .tip{opacity:1;transform:none}
.lbl{display:none;font-size:12px;font-weight:500;white-space:nowrap;letter-spacing:.01em}
.dock-head{display:none;align-items:center;justify-content:space-between;padding:2px 6px 10px;flex:none}
.dock-head .db{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600}
.dock-head .db i{width:7px;height:7px;border-radius:50%;background:var(--gold);display:inline-block;box-shadow:0 0 0 3px rgba(233,180,107,.18)}
.dock-x{width:28px!important;height:28px!important;border-radius:9px!important}
.dock-sec{display:none;font-size:9.5px;letter-spacing:.09em;color:var(--mut2);font-weight:600;padding:12px 10px 5px;flex:none}
#dockOpen{position:relative;width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:var(--mut);transition:background .2s,color .2s,transform .2s;flex:none}
#dockOpen:hover{background:rgba(255,255,255,.1);color:var(--tx)}#dockOpen:active{transform:scale(.92)}
aside.open{width:216px;top:12px;bottom:12px;transform:none;border-radius:22px;padding:12px 10px;align-items:stretch;overflow-y:auto}
aside.open .dock-head{display:flex}
aside.open .dock-sec{display:block}
aside.open #dockOpen{display:none}
aside.open button:not(.dock-x){display:flex;align-items:center;width:100%;height:40px;border-radius:12px;justify-content:flex-start;gap:12px;padding:0 10px}
aside.open .lbl{display:inline}
aside.open .tip{display:none}
aside:not(.open) .dock-head,aside:not(.open) .dock-sec{display:none}
#dockBackdrop{position:fixed;inset:0;z-index:45;background:rgba(10,5,2,.55);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .35s}
#dockBackdrop.show{opacity:1;pointer-events:auto}
.dock-foot{display:flex;flex-direction:column;gap:8px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line);flex:none}
.dock-ghost{border:1px solid var(--line)!important;background:rgba(255,255,255,.04)!important;justify-content:center;gap:9px!important;font-size:12px}
aside.open .dock-ghost{justify-content:flex-start}
.dock-ghost:hover{background:rgba(255,255,255,.09)!important;color:var(--tx)}
.dock-ghost.warn{color:var(--red)}.dock-ghost.warn:hover{color:var(--red);background:rgba(232,145,138,.1)!important}
main{margin:12px 16px 40px 84px;border-radius:28px;padding:30px 28px 34px;min-height:calc(100vh - 100px);background:linear-gradient(180deg,rgba(60,38,20,.5),rgba(24,15,9,.55));transition:opacity .22s,filter .22s}
body.light main{background:rgba(255,248,235,.45)}
main.leave{opacity:0;filter:blur(8px)}
.sub{font-size:11.5px;color:var(--mut)}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:14px}
.ttl{overflow:hidden;padding-bottom:4px}.ttl h1{display:inline-block;font-size:31px;font-weight:500;letter-spacing:-.015em;animation:up .7s var(--p3) both}
@keyframes up{from{transform:translateY(105%)}}
@keyframes cin{from{opacity:0;transform:translateY(12px);filter:blur(6px)}}
.cta{background:var(--cream);color:var(--ink);padding:10px 17px;border-radius:13px;font-size:12px;font-weight:600;display:flex;gap:7px;align-items:center;white-space:nowrap;transition:transform .2s}.cta:hover{transform:translateY(-1px)}
.gd{display:grid;gap:14px}
.card{border-radius:19px;padding:16px 18px;animation:cin .7s var(--p3) both;animation-delay:var(--d,0ms)}
.card h3{font-size:12.5px;font-weight:500;color:var(--mut)}.card h3.h{color:var(--tx);font-size:13.5px}
.big{font-size:30px;font-weight:500;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:10px;padding:3px 7px;border-radius:7px;background:rgba(232,145,138,.2);color:var(--red);margin-right:7px}
.seg{display:flex;padding:3px;border-radius:11px;background:rgba(0,0,0,.28);border:1px solid var(--line)}
.seg button{font-size:10.5px;padding:5px 12px;border-radius:8px;color:var(--mut);transition:.25s}.seg button.on{background:#0b0603;color:#f1e7d6}
.row{display:flex;align-items:center;gap:12px;padding:10px 0}.ic{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.075);display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.row .m{flex:1;font-size:12.5px}.row small{display:block;color:var(--mut);font-size:10.5px;margin-top:2px}.row b{font-size:12px;font-weight:500}.pos{color:var(--grn)}
.bar{height:5px;border-radius:9px;background:rgba(255,255,255,.11);overflow:hidden;margin:8px 0 6px}.bar i{display:block;height:100%;background:#d3c4ae;border-radius:9px;width:0;transition:width 1.3s var(--pio) .3s}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:4px 0 18px}
.tabs button{font-size:12px;padding:0 0 10px;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px;transition:.25s;display:flex;gap:7px;align-items:center}.tabs button.on{color:var(--tx);border-color:var(--tx)}
.ct{font-size:10px;background:rgba(255,255,255,.1);border-radius:99px;padding:1px 7px}
.fl{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.fl .s{display:flex;gap:8px;align-items:center;padding:0 14px;height:36px;border-radius:12px;background:rgba(0,0,0,.2);border:1px solid var(--line);min-width:260px;color:var(--mut);font-size:12px}
.pl{font-size:11px;padding:7px 13px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--mut);display:flex;gap:7px;align-items:center;transition:.25s}.pl.on{background:var(--cream);color:var(--ink);font-weight:600}
.a{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:8px;font-weight:700;color:#2a1b0e;flex:none}
.c1{background:#ecd9a0}.c2{background:#cfe0cf}.c3{background:#efc2b0}.c4{background:#d6e3d3}.c5{background:#bfe0d8}
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.col{border-radius:20px;padding:14px 12px;animation:cin .7s var(--p3) both;animation-delay:var(--d,0ms)}
.ch{display:flex;justify-content:space-between;padding:2px 6px 12px;font-size:13px}.ch span{display:flex;gap:8px;align-items:center}.ch small{font-size:9.5px;color:var(--mut);display:block;text-align:right}
.dt{width:8px;height:8px;border-radius:50%}
.kc{position:relative;border-radius:15px;padding:12px 12px 11px 14px;margin-bottom:9px;background:rgba(255,240,215,.065);border:1px solid var(--line);border-left:2px solid var(--st);transition:transform .25s,background .25s;cursor:grab}
.kc:hover{transform:translateY(-2px);background:rgba(255,240,215,.1)}
.kc .t{display:flex;gap:9px;align-items:center;font-size:12.5px;font-weight:500}.kc .t small{display:block;font-size:10px;color:var(--mut);font-weight:400}.kc .t em{margin-left:auto;font-style:normal;color:var(--mut);letter-spacing:1px}
.kc .t .a{width:26px;height:26px;font-size:9px}.kc .f{display:flex;align-items:center;gap:9px;margin-top:11px;font-size:11.5px;font-weight:500}.kc .f span{display:flex;gap:5px;align-items:center;color:var(--mut);font-weight:400}.kc .f .a{margin-left:auto;width:24px;height:24px;color:#2a1b0e;font-size:8.5px;font-weight:700}
.cal{border-radius:19px;padding:16px 18px;animation:cin .7s var(--p3) both}
.lg{display:flex;gap:14px;font-size:10.5px;color:var(--mut);margin:12px 0}.lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.cg{display:grid;grid-template-columns:52px repeat(6,1fr);position:relative}
.dh{font-size:11px;color:var(--mut);padding:6px 8px 10px}.dh b{font-size:14px;color:var(--tx);font-weight:500;margin-left:3px}.dh .td{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--cream);color:var(--ink);font-size:12px;font-weight:600;margin-left:3px}
.hr{font-size:9.5px;color:var(--mut2);text-align:right;padding-right:10px;height:56px;transform:translateY(-6px)}
.dc{position:relative;border-left:1px solid var(--line);height:calc(56px*11);background:repeating-linear-gradient(180deg,transparent 0 55px,var(--line) 55px 56px)}.dc.t{background-color:rgba(255,240,215,.07)}
.ev{position:absolute;left:3px;right:3px;border-radius:9px;padding:5px 8px;font-size:10px;font-weight:600;overflow:hidden;border:1px solid;background:rgba(40,26,16,.8);animation:cin .6s both;animation-delay:var(--d)}
.ev small{display:block;font-weight:400;color:var(--mut);margin-top:2px;font-size:9.5px}
.nw{position:absolute;left:0;right:0;height:2px;background:var(--gold);z-index:2}.nw:before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.g4{display:grid;gap:14px;grid-template-columns:repeat(4,1fr)}.g1{grid-template-columns:.78fr 1.7fr}.g2{grid-template-columns:1.55fr 1fr;margin-top:14px}.g3{grid-template-columns:2.05fr 1fr;margin-top:14px}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.6s var(--pio) forwards;animation-delay:.2s}@keyframes dr{to{stroke-dashoffset:0}}
.fi{opacity:0;animation:fi 1s .9s forwards}@keyframes fi{to{opacity:1}}
.br{transform-origin:bottom;transform-box:fill-box;transform:scaleY(0);animation:gr .9s var(--p3) forwards;animation-delay:calc(var(--k)*70ms + 250ms)}@keyframes gr{to{transform:scaleY(1)}}
svg text{fill:var(--mut);font-size:9.5px;font-family:Urbanist}
.rip{position:fixed;width:36px;height:36px;margin:-18px 0 0 -18px;border:2px solid #f1e8da;border-radius:50%;pointer-events:none;z-index:99;animation:rp .6s var(--p3) forwards}@keyframes rp{from{transform:scale(.5);opacity:1}to{transform:scale(1.5);opacity:0}}
@media(max-width:980px){.kb,.g4{grid-template-columns:repeat(2,1fr)}.g1,.g2,.g3{grid-template-columns:1fr}.rt span{display:none}.brand small{display:none}}
@media(max-width:700px){header{flex-wrap:wrap;height:auto;padding:10px;margin-left:72px}nav{order:3;width:100%;overflow-x:auto;margin:0}main{margin-left:72px;padding:20px 16px}.kb,.g4{grid-template-columns:1fr}.cg{min-width:640px}.calw{overflow-x:auto}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body>

<script>
const $=s=>document.querySelector(s),I=n=>`<svg class="i"><use href="#${n}"/></svg>`;
const T=[["Overview","ov"],["Pipeline","pl"],["Clients","us"],["Schedule","cal",2],["Finance","fn",6],["Growth","gr"],["Projects","pj"]];
const D=[["Search","s"],["New","p","pr"],["Favourites","st"],["Today","cal"],["Calls","ph"],["Send","sd"],["Links","ln"],["Export","dl"],0,["Settings","set"],["Help","q"]];
$('#dock').innerHTML=`<button id="dockOpen"><svg class="i"><use href="#mn"/></svg></button>
